name: Crea TeatroApp.exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['teatro/**', 'main.py', 'libreria/**', 'requirements.txt', 'build_exe.bat', '.github/workflows/build-exe.yml', 'tests/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installa i pacchetti
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Prova automatica (senza schermo)
        continue-on-error: true
        run: python tests/smoke.py
      - name: Crea l'eseguibile
        run: python -m PyInstaller --noconfirm --windowed --name TeatroApp --collect-all pyqtgraph --exclude-module pyqtgraph.examples --exclude-module pyqtgraph.jupyter --hidden-import OpenGL.platform.win32 main.py
      - name: Prepara la cartella
        shell: pwsh
        run: |
          Copy-Item -Recurse libreria dist/TeatroApp/libreria
          Copy-Item TeatroApp_Manuale.pdf, LEGGIMI.txt dist/TeatroApp/
          Compress-Archive -Path dist/TeatroApp -DestinationPath TeatroApp_exe.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TeatroApp_exe
          path: TeatroApp_exe.zip
      - name: Pubblica nella pagina Release (ultima versione)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-versione --yes --cleanup-tag 2>$null
          gh release create ultima-versione TeatroApp_exe.zip --title "TeatroApp - ultima versione (exe Windows)" --notes "Scarica TeatroApp_exe.zip, estrai la cartella e avvia TeatroApp.exe. Il manuale e' dentro la cartella." --latest
